; THPS4+ settings. Put this file next to d3d8.dll in the game folder.
; Keys: F1-F12, a single letter or digit (A-Z, 0-9), or a hex virtual-key code like 0x75.

[Hotkeys]
ReloadIni=F5
DumpAllTextures=F10
; Dump every texture used in the next frame as PNG to THPS4Plus\dump\textures\
DumpTextures=F6
; Dump every 2D draw (HUD quads, coordinates) of the next frame to THPS4Plus\dump\hud_dump_001.txt, 002, ... (one file per press)
DumpHud=F9

[Display]
Windowed=0
; The real screen size the game renders at. Any size works. 0 and 0 = use your desktop resolution.
Width=0
Height=0
; Optional frames per second cap (for experiments). 0 = off, which is the default.
FrameLimit=60

[Render]
FarScalePercent=300

[Dump]
; How many consecutive frames one press of the HUD dump key records (1-12). Use 3 or more to
; catch something that flickers between frames.
HudFrames=1

[Widescreen]
; 1 = widescreen on, 0 = off (game runs exactly as before; use this to test if something breaks)
Enable=1
; 1 = HUD corners stick to the screen edges, 0 = HUD stays in a centred 4:3 box
HudAnchor=1
; 3D view: 1 = see more at the sides, same height (Hor+; the game's own culling can make
;          ground/walls vanish at the far edges), 2 = same width, crops top/bottom (Vert-; safe,
;          no edge glitches), 0 = leave the 3D projection alone
FovFix=1
; 1 = rescale 2D/HUD drawing, 0 = leave it alone (for diagnosing)
RemapHud=1
; The fixed layout space the game's HUD is designed in (leave at 640 x 480)
LoadingTextures=28476833231B7CEF,FA1CBD2CCFD86A92,D813138F9BC26B6F,9B13853286F97F70,1C18F6A6831381E8,2D4CB94BB9F607FD,2FDB3F9E32BFECB6,570C3D3D48B46C14,55140228698415D8,B141FF9E9036A287,BCEFE11E64695A2E,C33CD0BB25F369D5,EFD6C3C21BE79A80,D0470562409F0A9B
LoadingAspect=16:9
VirtualWidth=640
VirtualHeight=480

[Menus]
; While a menu or dialog is open, its pieces go in the centred 4:3 box so nothing is torn apart.
; What happens to the score / pro points / cash HUD in each kind of screen:
;   anchored = stays in its screen corners   hidden = not drawn   tucked = moved into the 4:3 box
HudInMenus=anchored
HudInDialogs=anchored
HudInPause=anchored
HudInKeyboard=anchored
; 1 = keep the placement rules (COMBO letters on the right, popups on the left ...) in every menu,
; not only while playing. Menu text itself is never moved by them.
RulesInMenus=1
; How each kind of screen is recognised: a texture (first 16 characters of a dumped PNG name)
; drawn on screen. Comma separated. If one screen is not recognised, add one of its textures here.
GenericTextures=46919C68E672BCA6
; Dialog boxes ("G to talk", conversations): the game does not switch to menu mode for them. These textures are only
; used to find the box, so anything drawn inside it (text, button icons) stays inside it, centred.
DialogTextures=8359A7261B70AB17,E115836C730D4A41,A48631B488B7E9F5,361D75E1D398621C,5708E8F8447D3B2B,FA0E6645AAEE1EB3
PauseTextures=EFE2536CD53A2079
KeyboardTextures=78F3151C1456619A

[Anchors]
; Which pieces of UI stick to a screen edge. EVERYTHING NOT LISTED stays exactly where the game puts it,
; in the centred 4:3 area (combo text, timer, balance meter, trick lists, menus ...).
; Whole textures (first 16 characters of a dumped PNG name). These are the score / cash HUD.
LeftTextures=8394163FF34108B5,37F7B338CC1A06CD,CA037E82868244D7,E1C6241B52A16B30,58996F233E19A2C1,CF103A4F94F52DBD
RightTextures=FCB17C018F4CC522
; Pieces drawn with a shared texture (like the font) are picked by a box in 640x480 layout units:
;   RuleN = texture, left, top, right, bottom, side (left/right/centre), isScoreCashHud (1 or 0), [requiresTexture]
; A piece matches when its centre is inside the box. isScoreCashHud=1 means the [Menus] policy
; (anchored / hidden / tucked) applies to it while a menu is open. The optional last field means
; "only if that texture was also drawn last frame" (cash digits only count when the cash box is on screen).
; Rules are tried in order, first match wins.
; Rule1: score digits. Only when the score panel (8394...) is on screen, so menu text near that spot can never match.
Rule1=A2CF8279019ABFA7,100,20,340,60,left,1,8394163FF34108B5
Rule2=A2CF8279019ABFA7,380,20,640,70,right,1,FCB17C018F4CC522
; IMPORTANT: text boxes start at x=380 so centred messages (centre x about 300, like "Failed!", "WATER...BAAAD!",
; the floating combo score) can never match. Only the arrow / "+" glyphs of long trick lines (texture 09D4...) reach
; further left, so only their rule starts at 280.
; Rule3: mission goal text at the top right (all its lines, including the wrapped ones)
Rule3=A2CF8279019ABFA7,380,20,640,95,right,0
; Rule4-7: right-side mission lists (trick list, goal lists, counters, COMBO letters) stay together on the right
Rule4=A2CF8279019ABFA7,380,80,640,385,right,0,8394163FF34108B5,0,1
Rule5=09D4AA800A5B227E,280,80,640,385,right,0,8394163FF34108B5,0,1
Rule6=27A32B419712CC70,380,80,640,385,right,0,0,0,1
Rule7=8555A6E401CED096,380,80,640,385,right,0,0,0,1
; Rule8: the PERFECT / SLOPPY landing text goes to the left edge
Rule8=A2CF8279019ABFA7,20,340,200,400,left,0,8394163FF34108B5
; Rule8/9 only apply while the score panel is on screen, so plain menus that have text in the same
; place (character select, the park editor, stats) are left alone.
; Rule9: text in the left column goes to the left edge: popups ("New Record! 3 Clocked Jocks", "1 Flag Pole
; grind"), and the online player names ("> ProSkater", "ProSkater : 1").
Rule9=A2CF8279019ABFA7,20,60,230,335,left,0,8394163FF34108B5
Rule10=09D4AA800A5B227E,280,20,640,95,right,0,8394163FF34108B5
Rule11=A2CF8279019ABFA7,20,60,230,335,left,0,0,3
Rule12=A2CF8279019ABFA7,20,340,200,400,left,0,0,3
Rule13=A2CF8279019ABFA7,505,80,640,385,right,0
Rule14=A2CF8279019ABFA7,305,80,380,385,right,0,27A32B419712CC70
; Optional extra margin for the score / cash HUD, in 640x480 units (to inset it from the screen edge
; or move it down, like a more modern HUD). 0 = exactly where the game puts it.
HudInsetX=0
HudInsetY=0

[Culling]
ViewDistancePercent=300
; THE CULLING FIX: makes the engine's own visibility test use the same wider view as the picture, so
; ground and walls no longer vanish at the screen edges. Only active with FovFix=1 (the wide 3D view).
; It patches 8 bytes of the game's code, but only if they match what we expect (CullPatchAddress is
; for this exe build). Set CullFix=0 to turn it off.
CullFix=1
CullPatchAddress=0044216F

; Diagnostic tool used to find those numbers (normally leave it off):
;   Probe=0  off (normal play)
;   Probe=2  watch the addresses in WatchAddresses. Load a level, press ProbeKey, wait for the first beep,
;            skate around for about 12 seconds, wait for the second beep, then send hook.log.
;   Probe=1  full memory scan (slower, only needed to find the numbers in a different exe version).
Probe=0
ProbeKey=F7
; Fixed addresses inside the game exe that hold the camera's culling numbers (up to 2, hex).
WatchAddresses=00A729C4
ScanValues=900,1764

[Import]
; Replacement textures. Put PNG files in THPS4Plus\import\textures\custom, named like the dumped file
; (the first 16 characters decide which game texture they replace, e.g. A2CF8279019ABFA7_256x256_A8R8G8B8.png).
; Any size works (use a 4x bigger version for HD); keep the same orientation and layout as the original.
; Use 32-bit/24-bit/palette PNGs, not interlaced. Mipmaps are generated automatically.
Enable=1
; The button-glyph sheet (arrows and key caps). See [Controller].
GlyphTexture=09D4AA800A5B227E

[Controller]
; When a controller is detected the glyph sheet is replaced by THPS4Plus\import\textures\controller\
;   xbox.png  playstation.png  nintendo.png  generic.png (any other controller)
; Same layout as the original sheet (a template is in THPS4Plus\dump\textures after you press the texture dump key).
; No controller detected = keyboard: the sheet from the custom folder is used if you put one there.
; If a controller has no matching file, generic.png is tried, then the keyboard sheet.
Detect=1
; auto = SDL2 (if SDL2.dll is next to the game), then DirectInput-era devices, then XInput.
; Or force one: sdl, dinput, xinput.
Backend=auto
; To preview without a controller: keyboard, xbox, playstation, nintendo or generic. auto = detect.
ForceType=auto

[Input]
Vibration=1
VibrationScale=100
TriggerButtons=11,12
TriggerAxis=0
DpadButtons=1
DpadHat=1
HideRealPads=0
DeviceType=gamepad
HidFlag=1
; auto = SDL2, then XInput, then winmm. Or force: sdl, xinput, winmm. off = the game uses its own DirectInput pads only.
Backend=auto
Enable=1
; 1 = the virtual pad is always offered, so you can plug in a pad later. 0 = only when a pad is found at startup.
AlwaysPresent=1
Deadzone=20

[Compat]
; If you use dgVoodoo (or another d3d8 wrapper), rename ITS d3d8.dll to something else,
; e.g. dgVoodoo_d3d8.dll, and put that name here. Our d3d8.dll then loads it instead of
; the system one. Leave empty to use the normal Windows d3d8.dll.
RealD3D8=dxvk_d3d8.dll

[Debug]
Group=
